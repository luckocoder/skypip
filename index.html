<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3fa9e8">
  <meta name="description" content="Skypip — a polished one-touch arcade flyer. Tap to fly, dodge the pipes, chase the sky.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Skypip">
  <title>Skypip</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='30' cy='34' r='22' fill='%232fc6b6' stroke='%230e4a52' stroke-width='4'/%3E%3Cellipse cx='36' cy='43' rx='15' ry='10' fill='%23fff4dc'/%3E%3Ccircle cx='39' cy='27' r='7' fill='%23fff' stroke='%230e4a52' stroke-width='3'/%3E%3Ccircle cx='41' cy='27' r='3.5' fill='%231b2333'/%3E%3Cpath d='M50 32l12 4-12 5z' fill='%23ffb627' stroke='%230e4a52' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@800;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game" aria-label="Skypip game area. Tap, click or press Space to fly."></canvas>
    <div id="vignette" aria-hidden="true"></div>

    <div id="ui">
      <!-- HUD -->
      <div class="hud" id="hud">
        <div class="score" id="score" aria-live="polite">0</div>
        <button type="button" class="icon-btn hud-pause" id="btn-pause" aria-label="Pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.6" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="toast" id="toast" role="status"></div>

      <!-- MAIN MENU -->
      <section class="screen screen-menu" id="screen-menu" aria-label="Main menu">
        <div class="logo" role="img" aria-label="Skypip">
          <div class="logo-word" aria-hidden="true">
            <span style="--i:0">S</span><span style="--i:1">K</span><span style="--i:2">Y</span><span class="alt" style="--i:3">P</span><span class="alt" style="--i:4">I</span><span class="alt" style="--i:5">P</span>
          </div>
          <div class="logo-tag">a tiny bird &middot; a very big sky</div>
        </div>

        <div class="menu-bottom">
          <div class="best-pill">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10v5.5a5 5 0 0 1-10 0z" fill="currentColor"/><path d="M7 5.5H4.2a3.2 3.2 0 0 0 3.3 4.4M17 5.5h2.8a3.2 3.2 0 0 1-3.3 4.4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 14v3.5M8 20.5h8M9.5 17.5h5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            <span>BEST</span><strong id="menu-best">0</strong>
          </div>
          <button type="button" class="btn btn-primary btn-play" id="btn-play">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a1.2 1.2 0 0 0 1.8 1l10.6-6.8a1.2 1.2 0 0 0 0-2L9.8 4.2A1.2 1.2 0 0 0 8 5.2z" fill="currentColor"/></svg>
            <span>PLAY</span>
          </button>
          <div class="menu-row">
            <button type="button" class="icon-btn" id="btn-sound-quick" aria-label="Mute"></button>
            <button type="button" class="icon-btn icon-btn-accent" id="btn-board" aria-label="World ranking">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 20.5v-7.5h6v7.5zM9 20.5V5.5h6v15zM15.5 20.5v-10h6v10z" fill="currentColor"/></svg>
            </button>
            <button type="button" class="icon-btn" id="btn-settings" aria-label="Settings">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.2" fill="none" stroke="currentColor" stroke-width="4.4" stroke-dasharray="3.4 2.25"/><circle cx="12" cy="12" r="5.6" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>
            </button>
          </div>
        </div>
        <p class="hint-keys mouse-only">Space / &uarr; to flap &nbsp;&middot;&nbsp; Esc to pause &nbsp;&middot;&nbsp; M to mute</p>
      </section>

      <!-- READY -->
      <section class="screen screen-ready" id="screen-ready" aria-label="Get ready">
        <h2 class="title title-ready">GET READY</h2>
        <div class="chevrons" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="ready-hint">
          <div class="tap-icon touch-only" aria-hidden="true"><span class="tap-dot"></span><span class="tap-ring"></span><span class="tap-ring r2"></span></div>
          <div class="keycap mouse-only" aria-hidden="true">SPACE</div>
          <p class="ready-sub"><span class="touch-only">Tap to fly</span><span class="mouse-only">Click or press Space to fly</span></p>
        </div>
      </section>

      <!-- RESUME COUNTDOWN -->
      <section class="screen screen-count" id="screen-count" aria-label="Resuming">
        <div class="count-num" id="count-num">3</div>
      </section>

      <!-- GAME OVER -->
      <section class="screen screen-over" id="screen-over" aria-label="Game over">
        <div class="over-wrap">
          <h2 class="title title-over">GAME OVER</h2>
          <div class="panel over-panel">
            <div class="medal-slot" id="medal-slot">
              <div class="medal-rays"></div>
              <div class="medal-empty"><span>?</span></div>
              <div class="medal" id="medal"></div>
              <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i>
              <div class="medal-name" id="medal-name"></div>
            </div>
            <div class="over-stats">
              <div class="stat">
                <span class="stat-label">SCORE</span>
                <span class="stat-value" id="over-score">0</span>
              </div>
              <div class="stat">
                <span class="stat-label">BEST <em class="badge-new" id="badge-new">NEW!</em></span>
                <span class="stat-value" id="over-best">0</span>
              </div>
            </div>
            <div class="over-hint" id="over-hint"></div>
            <div class="over-rank" id="over-rank" role="status"></div>
          </div>
          <div class="btn-row">
            <button type="button" class="btn btn-primary btn-restart" id="btn-restart">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M4 3.5v5h5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>PLAY AGAIN</span>
            </button>
            <button type="button" class="btn btn-violet btn-square" id="btn-over-board" aria-label="World ranking">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 20.5v-7.5h6v7.5zM9 20.5V5.5h6v15zM15.5 20.5v-10h6v10z" fill="currentColor"/></svg>
            </button>
            <button type="button" class="btn btn-secondary btn-square" id="btn-over-menu" aria-label="Main menu">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2V19a1.5 1.5 0 0 1-1.5 1.5h-4.2v-6h-5.6v6H5A1.5 1.5 0 0 1 3.5 19z" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
      </section>

      <!-- PAUSE -->
      <section class="screen screen-pause modal" id="screen-pause" aria-label="Paused">
        <div class="panel menu-panel">
          <h2 class="ribbon">PAUSED</h2>
          <button type="button" class="btn btn-primary btn-block" id="btn-resume">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a1.2 1.2 0 0 0 1.8 1l10.6-6.8a1.2 1.2 0 0 0 0-2L9.8 4.2A1.2 1.2 0 0 0 8 5.2z" fill="currentColor"/></svg>
            <span>RESUME</span>
          </button>
          <button type="button" class="btn btn-secondary btn-block" id="btn-pause-restart">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M4 3.5v5h5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>RESTART</span>
          </button>
          <div class="settings-group" data-sound-controls></div>
          <button type="button" class="btn btn-ghost btn-block" id="btn-pause-menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2V19a1.5 1.5 0 0 1-1.5 1.5h-4.2v-6h-5.6v6H5A1.5 1.5 0 0 1 3.5 19z" fill="currentColor"/></svg>
            <span>MAIN MENU</span>
          </button>
        </div>
      </section>

      <!-- SETTINGS -->
      <section class="screen screen-settings modal" id="screen-settings" aria-label="Settings" aria-hidden="true">
        <div class="panel menu-panel">
          <h2 class="ribbon">SETTINGS</h2>
          <div class="settings-group" data-sound-controls></div>
          <div class="settings-group"><div class="setting-row" id="shake-row"></div></div>
          <button type="button" class="btn btn-primary btn-block" id="btn-settings-close"><span>DONE</span></button>
        </div>
      </section>

      <!-- WORLD RANKING -->
      <section class="screen screen-board modal" id="screen-board" aria-label="World ranking" aria-hidden="true">
        <div class="panel menu-panel board-panel">
          <h2 class="ribbon">WORLD RANKING</h2>
          <div class="board-tabs" role="tablist">
            <button type="button" class="tab active" data-board="week" role="tab" aria-selected="true">THIS WEEK</button>
            <button type="button" class="tab" data-board="all" role="tab" aria-selected="false">ALL TIME</button>
          </div>
          <div class="board-list" id="board-list" role="list" tabindex="-1"></div>
          <div class="board-you" id="board-you"></div>
          <form class="name-row" id="name-form" novalidate>
            <input class="text-input" id="name-input" type="text" maxlength="14" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Your player name" placeholder="Your name">
            <button type="submit" class="btn btn-secondary btn-small" id="btn-name-save"><span>SAVE</span></button>
          </form>
          <div class="name-status" id="name-status" role="status"></div>
          <button type="button" class="btn btn-primary btn-block" id="btn-board-close"><span>DONE</span></button>
        </div>
      </section>
    </div>

    <canvas id="fx" aria-hidden="true"></canvas>
    <div id="curtain" aria-hidden="true"></div>
    <noscript><div class="noscript">Skypip needs JavaScript to fly.</div></noscript>
  </div>

  <script src="js/core/config.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/leaderboard.js"></script>
  <script src="js/core/audio.js"></script>
  <script src="js/core/input.js"></script>
  <script src="js/world/sprites.js"></script>
  <script src="js/world/bird.js"></script>
  <script src="js/world/particles.js"></script>
  <script src="js/world/background.js"></script>
  <script src="js/world/pipes.js"></script>
  <script src="js/ui/confetti.js"></script>
  <script src="js/ui/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
